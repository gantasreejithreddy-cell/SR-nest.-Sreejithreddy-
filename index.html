<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SR Nest | Find Your Perfect Home</title>

<meta name="google-site-verification" content="55STJi9ytAiyID_DaIHX_9DXiMtMOxeTRe63lz3HbS4"/>
<meta name="theme-color" content="#6366F1"/>
<meta name="description" content="SR Nest - Find rental homes, save properties and book house visits."/>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="icon" type="image/png" sizes="192x192" href="1785333686872.png"/>
<link rel="shortcut icon" href="1785333686872.png"/>
<link rel="apple-touch-icon" href="1785333686872.png"/>
<meta property="og:image" content="1785333686872.png"/>

<link rel="manifest" href="manifest.json"/>

<style>
:root{
  --primary:#6366F1;
  --primary2:#8B5CF6;
  --blue:#38BDF8;
  --green:#10B981;
  --red:#F43F5E;
  --orange:#F97316;
  --bg:#070B17;
  --bg2:#0F172A;
  --card:rgba(15,23,42,.76);
  --card2:rgba(30,41,59,.72);
  --border:rgba(255,255,255,.10);
  --text:#F8FAFC;
  --muted:#94A3B8;
  --radius:22px;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:
    radial-gradient(circle at 0% 0%,rgba(99,102,241,.22),transparent 35%),
    radial-gradient(circle at 100% 30%,rgba(56,189,248,.12),transparent 30%),
    radial-gradient(circle at 80% 100%,rgba(139,92,246,.18),transparent 35%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  padding-bottom:88px;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.page{
  display:none;
  min-height:calc(100vh - 80px);
  animation:pageIn .35s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= HEADER ================= */

.top-nav{
  position:sticky;
  top:0;
  z-index:1000;
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:rgba(7,11,23,.78);
  backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  user-select:none;
}

.logo img{
  width:40px;
  height:40px;
  object-fit:cover;
  border-radius:13px;
  box-shadow:0 7px 25px rgba(99,102,241,.35);
}

.logo-main{
  font-size:1.2rem;
  font-weight:800;
  background:linear-gradient(135deg,#38BDF8,#818CF8,#C084FC);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.logo-sub{
  color:var(--muted);
  font-size:.68rem;
  font-weight:600;
  display:block;
  margin-top:1px;
}

/* ================= BUTTONS ================= */

.btn{
  border:0;
  border-radius:15px;
  padding:12px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:white;
  font-weight:700;
  transition:.22s ease;
  text-decoration:none;
  min-height:45px;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:scale(.97);
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.btn-primary{
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  box-shadow:0 9px 28px rgba(99,102,241,.28);
}

.btn-blue{
  background:linear-gradient(135deg,#0284C7,#38BDF8);
  box-shadow:0 9px 28px rgba(56,189,248,.20);
}

.btn-green{
  background:linear-gradient(135deg,#059669,#10B981);
}

.btn-danger{
  background:linear-gradient(135deg,#E11D48,#F43F5E);
}

.btn-ghost{
  background:rgba(255,255,255,.065);
  border:1px solid var(--border);
  color:var(--text);
}

.btn-lg{
  min-height:54px;
  padding:15px 25px;
  border-radius:17px;
}

.btn-sm{
  min-height:38px;
  padding:8px 13px;
  font-size:.82rem;
  border-radius:11px;
}

/* ================= HOME ================= */

.hero{
  max-width:1150px;
  margin:auto;
  min-height:calc(100vh - 74px);
  padding:70px 22px 45px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 16px;
  border-radius:999px;
  background:rgba(99,102,241,.12);
  border:1px solid rgba(129,140,248,.25);
  color:#A5B4FC;
  font-size:.76rem;
  font-weight:800;
  letter-spacing:.8px;
  text-transform:uppercase;
  margin-bottom:23px;
}

.hero h1{
  max-width:900px;
  font-size:clamp(2.45rem,7vw,5.4rem);
  line-height:1.02;
  font-weight:800;
  letter-spacing:-2.8px;
  background:linear-gradient(135deg,#fff 12%,#38BDF8 48%,#A78BFA 82%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-description{
  max-width:680px;
  color:var(--muted);
  font-size:1.04rem;
  line-height:1.7;
  margin:23px auto 30px;
}

.creator{
  color:#38BDF8;
  font-weight:800;
  margin-top:20px;
}

.hero-actions{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.hero-stats{
  width:100%;
  max-width:700px;
  margin-top:48px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat-card{
  padding:18px 12px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  border-radius:18px;
  backdrop-filter:blur(12px);
}

.stat-number{
  font-size:1.35rem;
  font-weight:800;
  color:#fff;
}

.stat-label{
  font-size:.72rem;
  color:var(--muted);
  margin-top:4px;
}

/* ================= PAGE HEADER ================= */

.page-header{
  max-width:1150px;
  margin:auto;
  padding:38px 20px 20px;
}

.page-header-inner{
  text-align:center;
}

.page-header h2{
  font-size:clamp(1.8rem,4vw,2.65rem);
  font-weight:800;
  background:linear-gradient(135deg,#fff,#38BDF8,#A78BFA);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.page-header p{
  color:var(--muted);
  margin-top:9px;
  font-size:.9rem;
}

/* ================= FILTERS ================= */

.filter-box{
  max-width:1150px;
  margin:10px auto 25px;
  padding:18px;
  background:rgba(15,23,42,.72);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
}

.search-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}

.search-input-wrap{
  position:relative;
}

.search-input-wrap span{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:1.1rem;
  pointer-events:none;
}

.search-input{
  padding-left:45px!important;
}

.filter-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:11px;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  color:#7DD3FC;
  font-size:.67rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin:0 0 6px 3px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  outline:none;
  background:rgba(2,6,23,.72);
  color:var(--text);
  border-radius:13px;
  padding:12px 13px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:rgba(99,102,241,.8);
  box-shadow:0 0 0 3px rgba(99,102,241,.10);
}

select option{
  background:#0F172A;
  color:#fff;
}

.filter-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.results-count{
  color:var(--muted);
  font-size:.82rem;
}

.results-count strong{
  color:#fff;
}

.quick-filters{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.chip{
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:#CBD5E1;
  border-radius:999px;
  padding:7px 12px;
  font-size:.74rem;
  font-weight:700;
  cursor:pointer;
}

.chip:hover{
  background:rgba(99,102,241,.18);
  border-color:rgba(129,140,248,.35);
}

/* ================= PROPERTY CARDS ================= */

.content-width{
  max-width:1150px;
  margin:auto;
  padding:0 20px 35px;
}

.house-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(285px,1fr));
  gap:18px;
}

.house-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(30,41,59,.76),rgba(15,23,42,.82));
  border:1px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  transition:.28s ease;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.house-card:hover{
  transform:translateY(-5px);
  border-color:rgba(129,140,248,.30);
  box-shadow:0 20px 50px rgba(0,0,0,.28);
}

.house-img{
  height:205px;
  position:relative;
  background:#172033;
  overflow:hidden;
}

.house-img img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:.4s ease;
}

.house-card:hover .house-img img{
  transform:scale(1.035);
}

.image-count{
  position:absolute;
  left:12px;
  bottom:12px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(8px);
  padding:6px 9px;
  border-radius:9px;
  font-size:.7rem;
  font-weight:700;
}

.fav-btn{
  position:absolute;
  right:12px;
  top:12px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(2,6,23,.62);
  color:white;
  font-size:1.2rem;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
  backdrop-filter:blur(9px);
}

.fav-btn.saved{
  background:#fff;
}

.card-body{
  padding:17px;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.bhk-badge{
  color:#C4B5FD;
  background:rgba(139,92,246,.13);
  border:1px solid rgba(139,92,246,.2);
  padding:5px 9px;
  border-radius:8px;
  font-size:.7rem;
  font-weight:800;
}

.card-title{
  font-size:1.08rem;
  font-weight:800;
  margin-bottom:6px;
}

.price{
  color:#38BDF8;
  font-size:1.25rem;
  font-weight:800;
}

.price small{
  color:var(--muted);
  font-size:.68rem;
  font-weight:600;
}

.location{
  color:var(--muted);
  font-size:.79rem;
  margin:10px 0 14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.card-view{
  width:100%;
}

.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  border:1px dashed rgba(255,255,255,.14);
  border-radius:22px;
  color:var(--muted);
}

.empty-icon{
  font-size:3rem;
  margin-bottom:12px;
}

.empty-state h3{
  color:#fff;
  margin-bottom:6px;
}

/* ================= SKELETON ================= */

.skeleton{
  overflow:hidden;
  position:relative;
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  animation:shine 1.3s infinite;
}

@keyframes shine{
  100%{transform:translateX(100%);}
}

.skeleton-img{
  height:205px;
  background:#172033;
}

.skeleton-body{
  padding:17px;
}

.skeleton-line{
  height:14px;
  border-radius:7px;
  background:#1E293B;
  margin-bottom:10px;
}

.skeleton-line.short{
  width:55%;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(2,6,23,.82);
  backdrop-filter:blur(15px);
}

.modal.active{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow-y:auto;
  position:relative;
  background:#101827;
  border:1px solid var(--border);
  border-radius:25px;
  padding:20px;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.modal-close{
  position:absolute;
  right:15px;
  top:13px;
  z-index:20;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:rgba(2,6,23,.70);
  color:#fff;
  font-size:1.45rem;
}

.detail-main{
  width:100%;
  height:310px;
  border-radius:17px;
  object-fit:cover;
  background:#172033;
}

.gallery{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:10px 0 16px;
  padding-bottom:3px;
}

.gallery img{
  flex:0 0 78px;
  width:78px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
  border:2px solid transparent;
  cursor:pointer;
}

.gallery img.active{
  border-color:#38BDF8;
}

.detail-heading{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.detail-heading h3{
  font-size:1.5rem;
}

.detail-location{
  color:var(--muted);
  margin:9px 0;
  font-size:.88rem;
}

.detail-description{
  color:#CBD5E1;
  line-height:1.65;
  font-size:.9rem;
  margin:15px 0;
  white-space:pre-wrap;
}

.detail-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.map-box{
  width:100%;
  height:240px;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--border);
  margin-top:9px;
}

/* ================= FORMS ================= */

.form-card{
  max-width:700px;
  margin:0 auto;
  background:rgba(15,23,42,.72);
  border:1px solid var(--border);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  color:#7DD3FC;
  font-size:.72rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

textarea{
  resize:vertical;
  min-height:90px;
}

.file-input{
  padding:10px;
}

.file-note{
  margin-top:7px;
  color:var(--muted);
  font-size:.72rem;
  line-height:1.5;
}

.map-help{
  color:var(--muted);
  font-size:.74rem;
  margin-top:7px;
}

/* ================= DASHBOARD ================= */

.dashboard{
  max-width:1050px;
  margin:auto;
  padding:0 20px 40px;
}

.dashboard-section{
  margin-bottom:28px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.section-title h3{
  font-size:1.15rem;
}

.section-title span{
  color:var(--muted);
  font-size:.75rem;
}

.request-card{
  background:rgba(15,23,42,.75);
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  margin-bottom:10px;
}

.request-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.status{
  padding:5px 9px;
  border-radius:999px;
  font-size:.68rem;
  font-weight:800;
}

.status.pending{
  background:rgba(245,158,11,.14);
  color:#FBBF24;
}

.status.accepted{
  background:rgba(16,185,129,.14);
  color:#34D399;
}

.status.rejected{
  background:rgba(244,63,94,.14);
  color:#FB7185;
}

.request-info{
  color:var(--muted);
  font-size:.78rem;
  line-height:1.8;
}

.request-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.divider{
  height:1px;
  background:var(--border);
  margin:28px 0;
}

/* ================= PROFILE ================= */

.profile-card{
  max-width:540px;
  margin:20px auto;
  padding:30px 22px;
  text-align:center;
  background:rgba(15,23,42,.76);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:var(--shadow);
}

.profile-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  margin:0 auto 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.3rem;
  background:linear-gradient(135deg,#6366F1,#38BDF8);
  box-shadow:0 12px 35px rgba(99,102,241,.28);
}

/* ================= SUPPORT ================= */

.support-card{
  max-width:540px;
  margin:20px auto;
  text-align:center;
  padding:35px 23px;
  background:rgba(15,23,42,.76);
  border:1px solid var(--border);
  border-radius:25px;
}

.support-icon{
  font-size:3.5rem;
  margin-bottom:13px;
}

.support-buttons{
  display:grid;
  gap:10px;
  margin-top:22px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:2000;
  bottom:0;
  left:0;
  width:100%;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(7,11,23,.90);
  backdrop-filter:blur(22px);
  border-top:1px solid var(--border);
  padding:5px 6px env(safe-area-inset-bottom);
}

.nav-item{
  flex:1;
  height:65px;
  max-width:130px;
  border:0;
  background:none;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:.65rem;
  font-weight:700;
}

.nav-item .icon{
  font-size:1.32rem;
  transition:.2s;
}

.nav-item.active{
  color:#38BDF8;
}

.nav-item.active .icon{
  transform:translateY(-2px) scale(1.08);
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  color:var(--muted);
  font-size:.72rem;
  padding:20px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){
  .filter-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .filter-grid .field:first-child{
    grid-column:1/-1;
  }
}

@media(max-width:600px){
  .top-nav{
    height:66px;
    padding:0 13px;
  }

  .logo img{
    width:35px;
    height:35px;
  }

  .logo-main{
    font-size:1rem;
  }

  .logo-sub{
    display:none;
  }

  .top-nav .btn{
    min-height:38px;
    padding:8px 12px;
    font-size:.72rem;
  }

  .hero{
    min-height:calc(100vh - 66px);
    padding:45px 18px 30px;
  }

  .hero h1{
    letter-spacing:-1.7px;
  }

  .hero-description{
    font-size:.9rem;
  }

  .hero-stats{
    margin-top:35px;
    gap:7px;
  }

  .stat-card{
    padding:13px 5px;
  }

  .stat-number{
    font-size:1.05rem;
  }

  .stat-label{
    font-size:.61rem;
  }

  .page-header{
    padding:28px 15px 15px;
  }

  .content-width,
